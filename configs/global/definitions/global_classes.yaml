classes:
  via.physics.Collider:
    to_string: "Collider: {Shape?.class_shortname} {CollisionFilter}"
  via.render.CompositeMeshInstanceGroup:
    to_string: "Group ({Transform.Count}) - {Mesh}"
  via.dynamics.CompositeRigidBodyMeshSet.MeshInfo:
    to_string: "RB MeshSet - {Position} {Resource}"
  via.GameObject:
    fields:
      Draw: { default: true }
      Update: { default: true }
      TimeScale: { default: -1.0 }
  via.Transform:
    fields:
      Scale: { default: { X: 1.0, Y: 1.0, Z: 1.0 } }
