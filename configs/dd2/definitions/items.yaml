entities:
  items.item_data:
    enums:
    - name: app.ItemIDEnum
      format: "It{id:06}"
      primary: true # denotes that the entity label should override this enum's corresponding display labels (entity id == enum value)
    # SmartFormat library is used for all string interpolation functionality
    # can fetch entity fields as well as nested object fields with "."
    to_string: "Item {id}: {name}"
    allow_create_empty: false
    allow_templates: true
    zero_entity:
      id: 0
    fields:
    - name: data
      required: true
      resource:
        id: [_Id]
        custom_id_range: [30000, 65000]
        type: merged-group
        classname: app.ItemCommonParam
        subtypes:
          app.ItemDataParam:
            type: array-file
            classname: app.ItemDataParam
            files:
            - AppSystem/Item/ItemData/ItemData.user
            - AppSystem/Item/ItemData/ExItemData.user
          app.ItemWeaponParam:
            type: array-file
            classname: app.ItemWeaponParam
            file: AppSystem/Item/ItemData/ItemWeaponData.user
          app.ItemArmorParam:
            type: array-file
            classname: app.ItemArmorParam
            file: AppSystem/Item/ItemData/ItemArmorData.user
    - name: name
      label: Name
      required: true
      field_type: keyed_message
      display_after: start
      resource:
        type: msg
        files:
        - Message/UI/ItemName.msg
        - Message/UI/ItemName_END.msg
        params:
          key_pattern: "item_name_(\\d+)"
          key_format: "item_name_{id}"
    - name: description
      label: Description
      required: true
      field_type: keyed_message
      display_after: name
      resource:
        type: msg
        files:
        - Message/UI/ItemDetail.msg
        - Message/UI/ItemDetail_END.msg
        params:
          key_pattern: "item_detail_(\\d+)"
          key_format: "item_detail_{id}"
          multiline: true
    - name: icon
      display_after: description
      # if we used vanilla tech, there would be a uvs file, added to the item master uvs file, and then an ID taken from there
      # alternatively we use content editor runtime tech, the patch needs to be saved as a CE bundle with tex and rect info
      field_type: DD2_ItemIcon
    - name: enhanceData
      label: Enhance data
      display_after: icon
      when_any:
      - field: data
        property: classname
        equals: app.ItemArmorParam
      - field: data
        property: classname
        equals: app.ItemWeaponParam
      resource:
        id: [_ItemId]
        sub_id: [_Type, _EnhanceNo]
        classname: app.EnhanceParamBase
        type: merged-group
        subtypes:
          armor:
            type: array-file
            file: AppSystem/Item/ItemData/ArmorEnhanceData.user
            classname: app.ArmorEnhanceParam
            when:
            - field: data
              property: classname
              equals: app.ItemArmorParam
          weapon:
            type: array-file
            file: AppSystem/Item/ItemData/WeaponEnhanceData.user
            classname: app.WeaponEnhanceParam
            when:
            - field: data
              property: classname
              equals: app.ItemWeaponParam
    runtime_mapping:
      runtime_type: item_data
      to_both:
        data: data
        name: name
        description: description
        enhanceData: enhance
        icon.icon_rect: icon_rect
        icon.icon_path: icon_path

  items.weapon:
    enums:
    - name: app.WeaponID
      format: "{name}"
      primary: true # denotes that the entity label should override this enum's corresponding display labels (entity id == enum value)
    to_string: 'Weapon {id:enum(app.WeaponID)} (#{id}): {id:reverseLookupEntity(item_data|\{data?._WeaponId@ItemWeaponParam\}|\{label\}|Unknown item)}'
    fields:
      - name: data
        label: Data
        resource:
          id: [ID]
          custom_id_range: [1000, 100000]
          type: array-file
          classname: app.WeaponCatalogData.Data
          file: AppSystem/Catalog/MainContents/Userdata/WeaponCatalogData.user
      - name: name
        label: Weapon ID name
        required: true
        display_after: start
        resource:
          type: string
          params:
            regex: "^wp[0-9_]+$"
            regexDescription: "Example: wp00_000"
            tooltip: Enter a name for the weapon ID. This should be unique across all weapons.
            initial: "{id:enum(app.WeaponID)}"
            diffable: false
      - name: offsets
        label: Offset setting
        resource:
          id: [ID]
          type: array-file
          classname: app.WeaponSetting.OffsetSetting
          file: AppSystem/Equipment/wp/WeaponSetting.user
      # - name: prefab
      #   label: Weapon prefab
      #   required: true
      #   field_type: resource_link
      #   resource:
      #     resource_type: prefab
      #     params:
      #       path: "{data?.Prefab?.Path}"
  items.WorldModel:
    to_string: "WorldModel {id} | {model._Mesh}"
    fields:
    - name: model
      required: true
      resource:
        custom_id_range: [200, 100000]
        type: resource_proxy_pfb
        file: AppSystem/Item/ItemModelData/ItemModelPrefabData.user

  # app.ItemMixParam:
  #   id: [_ItemId]
  # app.ItemMixMaterialParam:
  #   id: [_ItemID]
  # app.ItemMixMaterialParam.CombineData:
  #   id: [_PairList, _CombineItem]

classes:
  app.ItemCommonParam:
    fields:
      _Attr: { enum: app.ItemAttrBits }
  app.ItemDataParam:
    to_string: "Item Data {_Id}"
    fields:
      _Id: { readOnly: true }
      _ModelId: { enum: WorldModel }
      _Attr: { enum: app.ItemAttrBits }
      _FakeItemId: { enum: item_data }
      _DecayedItemId: { enum: item_data }
      _UseAttr: { enum: app.ItemUseAttrBits }
  app.ItemWeaponParam:
    fields:
      _Id: { readOnly: true }
      _ModelId: { enum: WorldModel }
      _Attr: { enum: app.ItemAttrBits }
      _Job: { enum: ce.ItemJobFlags }
  app.ItemArmorParam:
    fields:
      _Id: { readOnly: true }
      _ModelId: { enum: WorldModel }
      _EquipCategory: { readOnly: true } # read-only to prevent mismatched object types
      _Attr: { enum: app.ItemAttrBits }
      _Job: { enum: ce.ItemJobFlags }
      _StyleNo:
        switch:
          property: _EquipCategory
          cases:
            2: { enum: "HelmStyle" }
            3: { enum: "TopsStyle" }
            4: { enum: "PantsStyle" }
            5: { enum: "MantleStyle" }
            7: { enum: "FacewearStyle" }

  app.ArmorEnhanceParam:
    to_string: ArmorEnhanceParam {_Type:enum(app.EnhanceType)} {_EnhanceNo}
    fields:
      _Type: { enum: app.EnhanceType }
      _ItemId: { enum: app.ItemIDEnum, readOnly: true }
      _NeedItemId0: { enum: app.ItemIDEnum }
      _NeedItemId1: { enum: app.ItemIDEnum }
  app.WeaponEnhanceParam:
    to_string: WeaponEnhanceParam {_Type:enum(app.EnhanceType)} {_EnhanceNo}
    fields:
      _Type: { enum: app.EnhanceType }
      _ItemId: { enum: app.ItemIDEnum, readOnly: true }
      _NeedItemId0: { enum: app.ItemIDEnum }
      _NeedItemId1: { enum: app.ItemIDEnum }
  app.ItemMixParam:
    fields:
      _ItemId: { enum: app.ItemIDEnum, readOnly: true }
      _MaterialA: { tooltip: 'Combination requires any MaterialA + any MaterialB item' }
      _MaterialB: { tooltip: 'Combination requires any MaterialA + any MaterialB item' }
      _IsNoSame: { tooltip: "Disallow picking the same item if it's present in both material sets" }
      _IsAutoMix: { tooltip: 'Possibly used for logistician?' }

  app.ItemMixMaterialParam:
    fields:
      _ItemID: { enum: app.ItemIDEnum }
  app.ItemMixMaterialParam.CombineData:
    fields:
      _PairList: { label: Items, tooltip: Combining with any item from this list will create the combine item }
      _CombineItem: { label: 'Output item' }
      _CombineMakeNum: { label: 'Output count' }
    to_string: "{_CombineItem}: {_PairList}"

  app.TopsPartsEnableItem:
    to_string: "Tops PartsEnable {_Gender:enum(app.Gender)} Job={_Job:enum(app.Character.JobEnum)} | {_TopsStyle:enum(app.TopsStyle)}"
  app.TopsAmPartsHiddenItem:
    to_string: "TopsAm PartsHidden Job={_Job:enum(app.Character.JobEnum)} | {_AmMeshID:enum(app.CharacterEditDefine.TopsAmMeshID)}"
  app.TopsBdPartsHiddenItem:
    to_string: "TopsBd PartsHidden Job={_Job:enum(app.Character.JobEnum)} | {_BdMeshID:enum(app.CharacterEditDefine.TopsBdMeshID)}"
  app.PantsLgPartsHiddenItem:
    to_string: "PantsLg PartsHidden Job={_Job:enum(app.Character.JobEnum)} | {_LgMeshID:enum(app.CharacterEditDefine.PantsLgMeshID)}"
  app.TopsBtPrimaryPartsHiddenItem:
    to_string: "BtPrimary PartsHidden Job={_Job:enum(app.Character.JobEnum)}"

