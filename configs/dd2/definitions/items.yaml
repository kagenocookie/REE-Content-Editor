entities:
  items.ItemData:
    enums:
    - name: app.ItemIDEnum
      format: "It{id:D06}"
      primary: true # denotes that the entity label should override this enum's corresponding display labels (entity id == enum value)
    # SmartFormat library is used for all string interpolation functionality
    # can fetch entity fields as well as nested object fields with "."
    to_string: "Item {id}: {name}"
    allow_create_empty: false
    allow_templates: true
    zero_entity:
      id: 0
    fields:
    - name: data
      required: true
      resource:
        id: [_Id]
        custom_id_range: [30000, 65000]
        type: merged-group
        classname: app.ItemCommonParam
        subtypes:
          app.ItemDataParam:
            type: object-catalog
            classname: app.ItemDataParam
            files:
            - AppSystem/Item/ItemData/ItemData.user
            - AppSystem/Item/ItemData/ExItemData.user
          app.ItemWeaponParam:
            type: object-catalog
            classname: app.ItemWeaponParam
            file: AppSystem/Item/ItemData/ItemWeaponData.user
          app.ItemArmorParam:
            type: object-catalog
            classname: app.ItemArmorParam
            file: AppSystem/Item/ItemData/ItemArmorData.user
    - name: name
      label: Name
      required: true
      field_type: keyed_message
      display_after: start
      resource:
        type: msg
        files:
        - Message/UI/ItemName.msg
        - Message/UI/ItemName_END.msg
        params:
          key_pattern: "item_name_(\\d+)"
          key_format: "item_name_{id}"
    - name: description
      label: Description
      required: true
      field_type: keyed_message
      display_after: name
      resource:
        type: msg
        files:
        - Message/UI/ItemDetail.msg
        - Message/UI/ItemDetail_END.msg
        params:
          key_pattern: "item_detail_(\\d+)"
          key_format: "item_detail_{id}"
          multiline: true
    - name: icon
      display_after: description
      required: true
      # if we used vanilla tech, there would be a uvs file, added to the item master uvs file, and then an ID taken from there
      # alternatively we use content editor runtime tech, the patch needs to be saved as a CE bundle with tex and rect info
      field_type: DD2_ItemIcon
    - name: DD2_StylePreview
      field_type: DD2_StylePreview
      display_after: description
      required: true
      resource:
        params:
          dataField: ""
          partField: ""
    - name: enhanceData
      label: Enhance data
      display_after: icon
      when_any:
      - field: data
        property: classname
        equals: app.ItemArmorParam
      - field: data
        property: classname
        equals: app.ItemWeaponParam
      resource:
        id: [_ItemId]
        sub_id: [_Type, _EnhanceNo]
        classname: app.EnhanceParamBase
        type: merged-group
        subtypes:
          armor:
            type: object-catalog
            file: AppSystem/Item/ItemData/ArmorEnhanceData.user
            classname: app.ArmorEnhanceParam
            initial_data: [{"$type":"app.ArmorEnhanceParam","_WeightRate":100,"_Weight":-19,"_NeedMoney":6300,"_PhysicalDefence":14,"_MagicDefence":7,"_ColdResist":0},{"$type":"app.ArmorEnhanceParam","_EnhanceNo":1,"_WeightRate":100,"_Weight":-19,"_NeedMoney":15120,"_NeedItemId0":221,"_NeedItemNum0":2,"_PhysicalDefence":24,"_MagicDefence":12,"_ColdResist":0},{"$type":"app.ArmorEnhanceParam","_EnhanceNo":2,"_WeightRate":100,"_Weight":-19,"_NeedMoney":31500,"_NeedItemId0":270,"_NeedItemNum0":2,"_NeedItemId1":234,"_NeedItemNum1":1,"_PhysicalDefence":35,"_MagicDefence":16,"_ColdResist":0},{"$type":"app.ArmorEnhanceParam","_Type":1,"_WeightRate":100,"_Weight":20,"_NeedMoney":6300,"_PhysicalDefence":22,"_MagicDefence":7,"_ColdResist":0},{"$type":"app.ArmorEnhanceParam","_Type":1,"_EnhanceNo":1,"_WeightRate":100,"_Weight":20,"_NeedMoney":15120,"_NeedItemId0":221,"_NeedItemNum0":2,"_PhysicalDefence":31,"_MagicDefence":9,"_ColdResist":0},{"$type":"app.ArmorEnhanceParam","_Type":1,"_EnhanceNo":2,"_WeightRate":100,"_Weight":20,"_NeedMoney":31500,"_NeedItemId0":269,"_NeedItemNum0":2,"_NeedItemId1":234,"_NeedItemNum1":1,"_PhysicalDefence":42,"_MagicDefence":11,"_ColdResist":0},{"$type":"app.ArmorEnhanceParam","_Type":2,"_WeightRate":100,"_Weight":-19,"_NeedMoney":6300,"_PhysicalDefence":12,"_MagicDefence":11,"_ColdResist":0},{"$type":"app.ArmorEnhanceParam","_Type":2,"_EnhanceNo":1,"_WeightRate":100,"_Weight":-19,"_NeedMoney":15120,"_NeedItemId0":221,"_NeedItemNum0":1,"_NeedItemId1":234,"_NeedItemNum1":1,"_PhysicalDefence":18,"_MagicDefence":14,"_ColdResist":0},{"$type":"app.ArmorEnhanceParam","_Type":2,"_EnhanceNo":2,"_WeightRate":100,"_Weight":-19,"_NeedMoney":31500,"_NeedItemId0":270,"_NeedItemNum0":2,"_NeedItemId1":277,"_NeedItemNum1":1,"_PhysicalDefence":22,"_MagicDefence":18,"_ColdResist":0},{"$type":"app.ArmorEnhanceParam","_Type":3,"_WeightRate":100,"_Weight":20,"_NeedMoney":6300,"_PhysicalDefence":12,"_MagicDefence":7,"_ShakeResistRate":60,"_BlowResistRate":60,"_ColdResist":0},{"$type":"app.ArmorEnhanceParam","_Type":3,"_EnhanceNo":1,"_WeightRate":100,"_Weight":20,"_NeedMoney":15120,"_NeedItemId0":221,"_NeedItemNum0":1,"_NeedItemId1":234,"_NeedItemNum1":1,"_PhysicalDefence":22,"_MagicDefence":11,"_ShakeResistRate":67,"_BlowResistRate":67,"_ColdResist":0},{"$type":"app.ArmorEnhanceParam","_Type":3,"_EnhanceNo":2,"_WeightRate":100,"_Weight":20,"_NeedMoney":31500,"_NeedItemId0":269,"_NeedItemNum0":2,"_NeedItemId1":277,"_NeedItemNum1":1,"_PhysicalDefence":33,"_MagicDefence":15,"_ShakeResistRate":75,"_BlowResistRate":75,"_ColdResist":0},{"$type":"app.ArmorEnhanceParam","_Type":4,"_WeightRate":50,"_NeedMoney":10,"_PhysicalDefence":20,"_MagicDefence":20,"_ColdResist":0}]
            when:
            - field: data
              property: classname
              equals: app.ItemArmorParam
          weapon:
            type: object-catalog
            file: AppSystem/Item/ItemData/WeaponEnhanceData.user
            classname: app.WeaponEnhanceParam
            initial_data: [{"$type":"app.WeaponEnhanceParam","_ItemId":-31603,"_WeightRate":100,"_Weight":-27,"_NeedMoney":3750,"_PhysicalAttack":34},{"$type":"app.WeaponEnhanceParam","_ItemId":-31603,"_EnhanceNo":1,"_WeightRate":100,"_Weight":-27,"_NeedMoney":9000,"_NeedItemId0":245,"_NeedItemNum0":2,"_PhysicalAttack":49},{"$type":"app.WeaponEnhanceParam","_ItemId":-31603,"_EnhanceNo":2,"_WeightRate":100,"_Weight":-27,"_NeedMoney":22500,"_NeedItemId0":277,"_NeedItemNum0":2,"_NeedItemId1":269,"_NeedItemNum1":2,"_PhysicalAttack":68},{"$type":"app.WeaponEnhanceParam","_ItemId":-31603,"_Type":1,"_WeightRate":100,"_Weight":28,"_NeedMoney":3750,"_PhysicalAttack":38},{"$type":"app.WeaponEnhanceParam","_ItemId":-31603,"_Type":1,"_EnhanceNo":1,"_WeightRate":100,"_Weight":28,"_NeedMoney":9000,"_NeedItemId0":245,"_NeedItemNum0":2,"_PhysicalAttack":57},{"$type":"app.WeaponEnhanceParam","_ItemId":-31603,"_Type":1,"_EnhanceNo":2,"_WeightRate":100,"_Weight":28,"_NeedMoney":22500,"_NeedItemId0":277,"_NeedItemNum0":2,"_NeedItemId1":269,"_NeedItemNum1":2,"_PhysicalAttack":95},{"$type":"app.WeaponEnhanceParam","_ItemId":-31603,"_Type":2,"_WeightRate":100,"_Weight":-27,"_NeedMoney":3750,"_PhysicalAttack":19},{"$type":"app.WeaponEnhanceParam","_ItemId":-31603,"_Type":2,"_EnhanceNo":1,"_WeightRate":100,"_Weight":-27,"_NeedMoney":9000,"_NeedItemId0":245,"_NeedItemNum0":1,"_NeedItemId1":269,"_NeedItemNum1":2,"_PhysicalAttack":38},{"$type":"app.WeaponEnhanceParam","_ItemId":-31603,"_Type":2,"_EnhanceNo":2,"_WeightRate":100,"_Weight":-27,"_NeedMoney":22500,"_NeedItemId0":277,"_NeedItemNum0":2,"_NeedItemId1":267,"_NeedItemNum1":2,"_PhysicalAttack":57},{"$type":"app.WeaponEnhanceParam","_ItemId":-31603,"_Type":3,"_WeightRate":100,"_Weight":28,"_NeedMoney":3750,"_PhysicalAttack":34,"_Shake":82,"_Blow":82},{"$type":"app.WeaponEnhanceParam","_ItemId":-31603,"_Type":3,"_EnhanceNo":1,"_WeightRate":100,"_Weight":28,"_NeedMoney":9000,"_NeedItemId0":245,"_NeedItemNum0":1,"_NeedItemId1":269,"_NeedItemNum1":2,"_PhysicalAttack":49,"_Shake":103,"_Blow":103},{"$type":"app.WeaponEnhanceParam","_ItemId":-31603,"_Type":3,"_EnhanceNo":2,"_WeightRate":100,"_Weight":28,"_NeedMoney":22500,"_NeedItemId0":277,"_NeedItemNum0":2,"_NeedItemId1":267,"_NeedItemNum1":2,"_PhysicalAttack":68,"_Shake":124,"_Blow":124},{"$type":"app.WeaponEnhanceParam","_ItemId":-31603,"_Type":4,"_WeightRate":50,"_NeedMoney":15,"_NeedItemNum0":1,"_NeedItemNum1":1,"_PhysicalAttack":70}]
            when:
            - field: data
              property: classname
              equals: app.ItemWeaponParam
    - name: mixRecipes
      label: Combine Recipes
      resource:
        type: item-list-catalog
        field: _Params
        classname: app.ItemMixParam
        id: [_ItemId]
        files:
        - AppSystem/Item/ItemMixData/ItemMixData.user
        - AppSystem/Item/ItemMixData/ExItemMixData.user
        params:
          nested: true
    - name: mixMaterials
      label: Mix Combinations
      resource:
        type: object-catalog
        field: _MaterialList
        classname: app.ItemMixMaterialParam
        id: [_ItemID]
        files:
        - AppSystem/Item/ItemMixData/ItemMixData.user
        - AppSystem/Item/ItemMixData/ExItemMixData.user
        params:
          nested: true
    runtime_mapping:
      runtime_type: item_data
      require_runtime_data: true
      to_both:
        data: data
        enhanceData: enhance
        icon.icon_rect: icon_rect
        icon.icon_path: icon_path
      to_desktop:
        name: name
        description: description
      to_runtime:
        name.Messages.English: name
        description.Messages.English: description

  items.Weapon:
    enums:
    - name: app.WeaponID
      format: "{name}"
      primary: true
    to_string: 'Weapon {id:enum(app.WeaponID)} (#{id}): {:findEntity(ItemData|data._WeaponId=id):{label}|Unknown Item}'
    zero_entity:
      id: 0
    before_create:
    - type: string-input
      field: name
    fields:
      - name: data
        label: Data
        resource:
          id: [ID]
          custom_id_range: [1000, 100000]
          type: object-catalog
          classname: app.WeaponCatalogData.Data
          file: AppSystem/Catalog/MainContents/Userdata/WeaponCatalogData.user
          params:
            duplicate_assets_on_create: true
            id_props:
            - "app.Weapon:ID"
      - name: name
        label: Weapon ID name
        required: true
        display_after: start
        resource:
          type: string
          params:
            regex: "^wp[0-9_]{2,}_[0-9_]{2,}$"
            regex_description: "Example: wp00_000_00"
            tooltip: Enter a name for the weapon ID. This should be unique across all weapons.
            initial: "{id:enum(app.WeaponID)}"
            diffable: false
            read_only: true
            unique_enum: app.WeaponID
    runtime_mapping:
      runtime_type: weapon
      to_desktop:
        id: data.Prefab.ID
      to_both:
        data.Prefab.Path: prefab._Item
  items.WeaponOffset:
    to_string: "Weapon Offset {id:enum(app.WeaponID)}"
    before_create:
    - type: id-enum-input
      classname: app.WeaponID
      field: newId
    fields:
    - name: data
      required: true
      resource:
        type: object-catalog
        id: [ID]
        classname: app.WeaponSetting.OffsetSetting
        file: AppSystem/Equipment/wp/WeaponSetting.user
        params:
          nested: false
  items.WorldModel:
    to_string: "WorldModel {id} | {model._Mesh}"
    fields:
    - name: model
      required: true
      resource:
        custom_id_range: [200, 100000]
        type: resource-holder-pfb
        file: AppSystem/Item/ItemModelData/ItemModelPrefabData.user
        params:
          skipFields: 1

classes:
  app.ItemCommonParam:
    fields:
      _Attr: { enum: app.ItemAttrBits }
  app.ItemDataParam:
    to_string: "Item Data {_Id}"
    fields:
      _Id: { read_only: true }
      _ModelId: { enum: WorldModel }
      _Attr: { enum: app.ItemAttrBits }
      _FakeItemId: { enum: ItemData }
      _DecayedItemId: { enum: ItemData }
      _UseAttr: { enum: app.ItemUseAttrBits }
  app.ItemWeaponParam:
    fields:
      _Id: { read_only: true }
      _ModelId: { enum: WorldModel }
      _Attr: { enum: app.ItemAttrBits }
      _Job: { enum: ce.ItemJobFlags }
      _WeaponId: { enum: Weapon }
  app.ItemArmorParam:
    fields:
      _Id: { read_only: true }
      _ModelId: { enum: WorldModel }
      _EquipCategory: { read_only: true } # read-only to prevent mismatched object types
      _Attr: { enum: app.ItemAttrBits }
      _Job: { enum: ce.ItemJobFlags }
      _StyleNo:
        switch:
          property: _EquipCategory
          cases:
            2: { enum: "HelmStyle" }
            3: { enum: "TopsStyle" }
            4: { enum: "PantsStyle" }
            5: { enum: "MantleStyle" }
            7: { enum: "FacewearStyle" }

  app.ArmorEnhanceParam:
    to_string: ArmorEnhanceParam {_Type:enum(app.EnhanceType)} {_EnhanceNo}
    fields:
      _Type: { enum: app.EnhanceType }
      _ItemId: { enum: ItemData, read_only: true }
      _NeedItemId0: { enum: ItemData }
      _NeedItemId1: { enum: ItemData }
  app.WeaponEnhanceParam:
    to_string: WeaponEnhanceParam {_Type:enum(app.EnhanceType)} {_EnhanceNo}
    fields:
      _Type: { enum: app.EnhanceType }
      _ItemId: { enum: ItemData, read_only: true }
      _NeedItemId0: { enum: ItemData }
      _NeedItemId1: { enum: ItemData }
  app.ItemMixParam:
    to_string: "Mix Param {_ItemId:entity(ItemData)}  (x{_Num})"
    fields:
      _ItemId: { enum: ItemData } # note: not read only because we currently can't preselect the Id on array item creation
      _MaterialA: { tooltip: 'Combination requires any MaterialA + any MaterialB item', enum: ItemData }
      _MaterialB: { tooltip: 'Combination requires any MaterialA + any MaterialB item', enum: ItemData }
      _IsNoSame: { tooltip: "Disallow picking the same item if it's present in both material sets" }
      _IsAutoMix: { tooltip: 'Possibly used for logistician?' }
      _Num: { default: 1 }
  app.ItemMixMaterialParam:
    fields:
      _ItemID: { enum: ItemData, read_only: true }
  app.ItemMixMaterialParam.CombineData:
    fields:
      _PairList: { label: Items, enum: ItemData, tooltip: Combining with any item from this list will create the combine item }
      _CombineItem: { label: 'Output Item', enum: ItemData }
      _CombineMakeNum: { label: 'Output Count', default: 1 }
    to_string: "CombineData {_CombineItem:entity(ItemData)}"

  app.ItemModelHolder:
    fields:
      Enabled: { default: true }

  app.WeaponSetting.OffsetSetting:
    to_string: "Weapon Offset Setting {ID:enum(app.WeaponID)}"
  app.WeaponSetting.Offset:
    to_string: "Weapon Offset [Left={IsLeftSetting}, {ParentJointName}]"
    fields:
      ParentJointName: { default: "R_PropA" }
      Scale: { default: 1.0 }
