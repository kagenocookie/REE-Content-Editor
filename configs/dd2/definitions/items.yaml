entities:
  items.ItemData:
    enums:
    - name: app.ItemIDEnum
      format: "It{id:D06}"
      primary: true # denotes that the entity label should override this enum's corresponding display labels (entity id == enum value)
    # SmartFormat library is used for all string interpolation functionality
    # can fetch entity fields as well as nested object fields with "."
    to_string: "Item {id}: {name}"
    allow_create_empty: false
    allow_templates: true
    zero_entity:
      id: 0
    fields:
    - name: data
      required: true
      resource:
        id: [_Id]
        custom_id_range: [30000, 65000]
        type: merged-group
        classname: app.ItemCommonParam
        subtypes:
          app.ItemDataParam:
            type: array-file
            classname: app.ItemDataParam
            files:
            - AppSystem/Item/ItemData/ItemData.user
            - AppSystem/Item/ItemData/ExItemData.user
          app.ItemWeaponParam:
            type: array-file
            classname: app.ItemWeaponParam
            file: AppSystem/Item/ItemData/ItemWeaponData.user
          app.ItemArmorParam:
            type: array-file
            classname: app.ItemArmorParam
            file: AppSystem/Item/ItemData/ItemArmorData.user
    - name: name
      label: Name
      required: true
      field_type: keyed_message
      display_after: start
      resource:
        type: msg
        files:
        - Message/UI/ItemName.msg
        - Message/UI/ItemName_END.msg
        params:
          key_pattern: "item_name_(\\d+)"
          key_format: "item_name_{id}"
    - name: description
      label: Description
      required: true
      field_type: keyed_message
      display_after: name
      resource:
        type: msg
        files:
        - Message/UI/ItemDetail.msg
        - Message/UI/ItemDetail_END.msg
        params:
          key_pattern: "item_detail_(\\d+)"
          key_format: "item_detail_{id}"
          multiline: true
    - name: icon
      display_after: description
      required: true
      # if we used vanilla tech, there would be a uvs file, added to the item master uvs file, and then an ID taken from there
      # alternatively we use content editor runtime tech, the patch needs to be saved as a CE bundle with tex and rect info
      field_type: DD2_ItemIcon
    - name: DD2_StylePreview
      field_type: DD2_StylePreview
      display_after: description
      required: true
      resource:
        params:
          dataField: ""
          partField: ""
    - name: enhanceData
      label: Enhance data
      display_after: icon
      when_any:
      - field: data
        property: classname
        equals: app.ItemArmorParam
      - field: data
        property: classname
        equals: app.ItemWeaponParam
      resource:
        id: [_ItemId]
        sub_id: [_Type, _EnhanceNo]
        classname: app.EnhanceParamBase
        type: merged-group
        subtypes:
          armor:
            type: array-file
            file: AppSystem/Item/ItemData/ArmorEnhanceData.user
            classname: app.ArmorEnhanceParam
            when:
            - field: data
              property: classname
              equals: app.ItemArmorParam
          weapon:
            type: array-file
            file: AppSystem/Item/ItemData/WeaponEnhanceData.user
            classname: app.WeaponEnhanceParam
            when:
            - field: data
              property: classname
              equals: app.ItemWeaponParam
    - name: mixRecipes
      label: Combine Recipes
      resource:
        type: multi-array
        field: _Params
        classname: app.ItemMixParam
        id: [_ItemId]
        files:
        - AppSystem/Item/ItemMixData/ItemMixData.user
        - AppSystem/Item/ItemMixData/ExItemMixData.user
        params:
          nested: true
    - name: mixMaterials
      label: Mix Combinations
      resource:
        type: array-file
        field: _MaterialList
        classname: app.ItemMixMaterialParam
        id: [_ItemID]
        files:
        - AppSystem/Item/ItemMixData/ItemMixData.user
        - AppSystem/Item/ItemMixData/ExItemMixData.user
        params:
          nested: true
    runtime_mapping:
      runtime_type: item_data
      to_both:
        data: data
        name: name
        description: description
        enhanceData: enhance
        icon.icon_rect: icon_rect
        icon.icon_path: icon_path

  items.Weapon:
    enums:
    - name: app.WeaponID
      format: "{name}"
      primary: true # denotes that the entity label should override this enum's corresponding display labels (entity id == enum value)
    to_string: 'Weapon {id:enum(app.WeaponID)} (#{id}): {id:reverseLookupEntity(ItemData|\{data?._WeaponId@ItemWeaponParam\}|\{label\}|Unknown item)}'
    fields:
      - name: data
        label: Data
        resource:
          id: [ID]
          custom_id_range: [1000, 100000]
          type: array-file
          classname: app.WeaponCatalogData.Data
          file: AppSystem/Catalog/MainContents/Userdata/WeaponCatalogData.user
      - name: name
        label: Weapon ID name
        required: true
        display_after: start
        resource:
          type: string
          params:
            regex: "^wp[0-9_]+$"
            regexDescription: "Example: wp00_000"
            tooltip: Enter a name for the weapon ID. This should be unique across all weapons.
            initial: "{id:enum(app.WeaponID)}"
            diffable: false
      - name: prefab
        label: Weapon prefab
        required: true
        field_type: resource_link
        resource:
          resource_type: prefab
          params:
            path: "{data?.Prefab?.Path}"
    runtime_mapping:
      runtime_type: weapon
      to_desktop:
        id: data.Prefab.ID
      to_both:
        data.Prefab.Path: prefab._Item
  items.WeaponOffset:
    to_string: "Weapon Offset {id:enum(app.WeaponID)}"
    fields:
    - name: data
      required: true
      resource:
        type: array-file
        id: [ID]
        classname: app.WeaponSetting.OffsetSetting
        file: AppSystem/Equipment/wp/WeaponSetting.user
        params:
          nested: false
  items.WorldModel:
    to_string: "WorldModel {id} | {model._Mesh}"
    fields:
    - name: model
      required: true
      resource:
        custom_id_range: [200, 100000]
        type: resource_proxy_pfb
        file: AppSystem/Item/ItemModelData/ItemModelPrefabData.user
        params:
          skipFields: 1

classes:
  app.ItemCommonParam:
    fields:
      _Attr: { enum: app.ItemAttrBits }
  app.ItemDataParam:
    to_string: "Item Data {_Id}"
    fields:
      _Id: { readOnly: true }
      _ModelId: { enum: WorldModel }
      _Attr: { enum: app.ItemAttrBits }
      _FakeItemId: { enum: ItemData }
      _DecayedItemId: { enum: ItemData }
      _UseAttr: { enum: app.ItemUseAttrBits }
  app.ItemWeaponParam:
    fields:
      _Id: { readOnly: true }
      _ModelId: { enum: WorldModel }
      _Attr: { enum: app.ItemAttrBits }
      _Job: { enum: ce.ItemJobFlags }
      _WeaponId: { enum: weapon }
  app.ItemArmorParam:
    fields:
      _Id: { readOnly: true }
      _ModelId: { enum: WorldModel }
      _EquipCategory: { readOnly: true } # read-only to prevent mismatched object types
      _Attr: { enum: app.ItemAttrBits }
      _Job: { enum: ce.ItemJobFlags }
      _StyleNo:
        switch:
          property: _EquipCategory
          cases:
            2: { enum: "HelmStyle" }
            3: { enum: "TopsStyle" }
            4: { enum: "PantsStyle" }
            5: { enum: "MantleStyle" }
            7: { enum: "FacewearStyle" }

  app.ArmorEnhanceParam:
    to_string: ArmorEnhanceParam {_Type:enum(app.EnhanceType)} {_EnhanceNo}
    fields:
      _Type: { enum: app.EnhanceType }
      _ItemId: { enum: ItemData, readOnly: true }
      _NeedItemId0: { enum: ItemData }
      _NeedItemId1: { enum: ItemData }
  app.WeaponEnhanceParam:
    to_string: WeaponEnhanceParam {_Type:enum(app.EnhanceType)} {_EnhanceNo}
    fields:
      _Type: { enum: app.EnhanceType }
      _ItemId: { enum: ItemData, readOnly: true }
      _NeedItemId0: { enum: ItemData }
      _NeedItemId1: { enum: ItemData }
  app.ItemMixParam:
    to_string: "Mix Param {_ItemId:entity(ItemData)}  (x{_Num})"
    fields:
      _ItemId: { enum: ItemData } # note: not read only because we currently can't preselect the Id on array item creation
      _MaterialA: { tooltip: 'Combination requires any MaterialA + any MaterialB item', enum: ItemData }
      _MaterialB: { tooltip: 'Combination requires any MaterialA + any MaterialB item', enum: ItemData }
      _IsNoSame: { tooltip: "Disallow picking the same item if it's present in both material sets" }
      _IsAutoMix: { tooltip: 'Possibly used for logistician?' }
      _Num: { default: 1 }
  app.ItemMixMaterialParam:
    fields:
      _ItemID: { enum: ItemData, readOnly: true }
  app.ItemMixMaterialParam.CombineData:
    fields:
      _PairList: { label: Items, enum: ItemData, tooltip: Combining with any item from this list will create the combine item }
      _CombineItem: { label: 'Output Item', enum: ItemData }
      _CombineMakeNum: { label: 'Output Count', default: 1 }
    to_string: "CombineData {_CombineItem:entity(ItemData)}"

  app.ItemModelHolder:
    fields:
      Enabled: { default: true }

  app.WeaponSetting.OffsetSetting:
    to_string: "Weapon Offset Setting {ID:enum(app.WeaponID)}"
  app.WeaponSetting.Offset:
    to_string: "Weapon Offset [Left={IsLeftSetting}, {ParentJointName}]"
    fields:
      ParentJointName: { default: "R_PropA" }
      Scale: { default: 1.0 }
