entities:
  items.styles.pants.PantsStyle:
    primary_field: data
    id_field: styleNo
    to_string: "Pants Style {id}: {data._PantsStyle:enum(app.PantsStyle)}"
    display_name: Style
    fields:
    - name: data
      display_after: styleNo
      field_id: { field: styleNo, path: value }
      resource:
        type: group
        id: [_PantsStyle]
        custom_id_range: [10000, 10000000]
        classname: app.PantsSwapItem
        subtypes:
          male:
            file: AppSystem/CharaEdit/ch000/SwapData/PantsSwapData.user
            type: array-file
            filter:
              property: _Gender
              equals: 2776536455
          female:
            file: AppSystem/CharaEdit/ch000/SwapData/PantsSwapData.user
            type: array-file
            filter:
              property: _Gender
              equals: 1910070090
    - name: styleNo
      resource:
        type: enum_mapping
        classname: app.PantsStyle
        custom_id_range: [10000, 32700] # _PantsStyleNo on the armor data is a signed short so we need to limit to that range
        params:
          virtual_enum_name: ce.PantsStyleNo
          new_label_format: "Pants_{id:D03}"
          label_id_parse: "Pants_(\\d+)"
          value_from: { field: data, path: _PantsStyle }

  items.styles.pants.PantsLgMesh:
    to_string: "{id:enum(app.CharacterEditDefine.PantsLgMeshID)} | {mesh._Mesh}"
    display_name: Legs Mesh
    enums:
    - name: "app.CharacterEditDefine.PantsLgMeshID"
      format: "pants_{id}_lg"
      primary: true
    zero_entity:
      id: 0
      label: None
    fields:
    - name: mesh
      required: true
      resource:
        custom_id_range: [10000, 10000000]
        file: AppSystem/CharaEdit/ch000/Catalog/PantsLgMeshCatalog_Default.user
        type: resource_proxy_pfb
        params:
          skipFields: 1
    - name: chain
      required: true
      resource:
        file: AppSystem/CharaEdit/ch000/Catalog/PantsLgChainCatalog_Default.user
        type: resource_proxy_pfb
        params:
          skipFields: 1
    - name: clsp
