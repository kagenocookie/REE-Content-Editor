    # runtime_mapping:
    #   runtime_type: PantsLgMesh
    #   to_both:
    #     mesh: mesh
    #     beastMesh: BeastMesh
    #     chain: Chain
    #     clsp: Clsp

  items.styles.pants.PantsLgSkin:
    to_string: "{id:enum(app.CharacterEditDefine.PantsLgSkinID)} | {skin._Material}"
    display_name: Legs Skin
    enums:
    - name: app.CharacterEditDefine.PantsLgSkinID
      format: "pants_{id}_lg"
      primary: true
