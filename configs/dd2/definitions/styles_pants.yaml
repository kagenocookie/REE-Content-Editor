      resource:
        file: AppSystem/CharaEdit/ch000/Catalog/PantsLgCollisionShapePresetCatalog_Default.user
        type: resource_proxy_pfb
        params:
          skipFields: 1
    - name: cloth
      required: true
      resource:
        custom_id_range: [10000, 10000000]
        file: AppSystem/CharaEdit/ch000/Catalog/PantsLgGpuClothCatalog_Default.user
        type: resource_proxy_pfb
        params:
          skipFields: 1
    - name: sfur
      required: true
      resource:
        file: AppSystem/CharaEdit/ch000/Catalog/PantsLgShellFurCatalog_Default.user
        type: resource_proxy_pfb
        params:
