# additional data:
# - weather schedules: AppSystem/Weather/Weatherschedulesetting1.user  (and additional 2-6 files)
# - grid -> weather mapping: editdata/gridattribute/weather/gridattributeweather.user

entities:
  weathers.Weather:
    to_string: "Weather {id}: {data.Area:enum(app.WeatherArea)} {data.Weather:enum(app.WeatherManager.WeatherEnum)}"
    fields:
    - name: data
      label: Data
      required: true
      resource:
        id: [Area, Weather]
        type: object-catalog
        file: AppSystem/Weather/WeatherUserData.user
        classname: app.WeatherUserData.WeatherData
        params:
          nested: false
    - name: postEffects
      label: Post Effects
      required: true
      display_after: start
      resource:
        id: [Area, Weather]
        type: item-list-catalog
        file: AppSystem/Weather/WeatherPostEffectUserData.user
        classname: app.WeatherManager.WeatherPostEffect.PostEffectData
  weathers.WeatherSchedule:
    to_string: "Weather Schedule {data._Area:enum(app.WeatherArea)}"
    fields:
    - name: data
      resource:
        type: user-singleton
        id: [_Area]
        classname: app.WeatherScheduleSettingData
        files:
        - AppSystem/Weather/WeatherScheduleSetting1.user
        - AppSystem/Weather/WeatherScheduleSetting2.user
        - AppSystem/Weather/WeatherScheduleSetting3.user
        - AppSystem/Weather/WeatherScheduleSetting4.user
        - AppSystem/Weather/WeatherScheduleSetting5.user
        - AppSystem/Weather/WeatherScheduleSetting6.user
classes:
  app.WeatherUserData.WeatherData:
    to_string: "Weather Data {Area:enum(app.WeatherArea)} {Weather:enum(app.WeatherManager.WeatherEnum)}"
  app.WeatherManager.WeatherPostEffect.PostEffectData:
    to_string: "Weather Effects {Area:enum(app.WeatherArea)} {Weather:enum(app.WeatherManager.WeatherEnum)} [{StartHour}~{EndHour}]"
  app.WeatherScheduleSettingData.WeatherScheduleDaySetting:
    auto_expand: false
    fields:
      _HourSettings:
        auto_expand: true
  app.WeatherScheduleSettingData.WeatherScheduleHourSetting:
    to_string: "Weather Schedule Hour [{_HourStart} - {_HourEnd}] {_Weather:enum(app.WeatherManager.WeatherEnum)}"
    auto_expand: false
