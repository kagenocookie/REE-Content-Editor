entities:
  items.styles.tops.TopsStyle:
    primary_field: data
    id_field: styleNo
    to_string: "Tops Style {id}: {data._TopsStyle:enum(app.TopsStyle)}"
    display_name: Style
    fields:
    - name: data
      display_after: styleNo
      field_id: { field: styleNo, path: value }
      # enums:
      # - name: app.TopsStyle
      #   new_label_format: "Tops_{data._TopsStyle:D03}"
      #   primary: true
      resource:
        # file: AppSystem/CharaEdit/ch000/SwapData/TopsSwapData.user
        # type: array-file
        # id: [_TopsStyle]
        # sub_id: [_Gender]
        # custom_id_range: [10000, 10000000]
        # classname: app.TopsSwapItem
        type: group
        id: [_TopsStyle]
        custom_id_range: [10000, 10000000]
        classname: app.TopsSwapItem
        subtypes:
          male:
            file: AppSystem/CharaEdit/ch000/SwapData/TopsSwapData.user
            type: array-file
            filter:
              property: _Gender
              equals: 2776536455
          female:
            file: AppSystem/CharaEdit/ch000/SwapData/TopsSwapData.user
            type: array-file
            filter:
              property: _Gender
              equals: 1910070090
    - name: styleNo
      resource:
        type: enum_mapping
        classname: app.TopsStyle
        custom_id_range: [10000, 32700] # _StyleNo on the armor data is a signed short so we need to limit to that range
        params:
          virtual_enum_name: ce.TopsStyleNo
          new_label_format: "Tops_{id:D03}"
          label_id_parse: "Tops_(\\d+)"
          value_from: { field: data, path: _TopsStyle }
    - name: furmask
      field_id: { field: styleNo, path: value }
      resource:
        type: group
        subtypes:
          male:
            file: AppSystem/CharaEdit/ch000/Catalog/FurMaskMapCatalog_m_Tops.user
            # classname: app.PartSwapCatalog.Item
            type: resource_proxy_pfb
            resource_type: texture
          female:
            file: AppSystem/CharaEdit/ch000/Catalog/FurMaskMapCatalog_f_Tops.user
            # classname: app.PartSwapCatalog.Item
            type: resource_proxy_pfb
            resource_type: texture

  items.styles.tops.TopsBdMesh:
    to_string: "{id:enum(app.CharacterEditDefine.TopsBdMeshID)} | {mesh.path}"
    display_name: Body Mesh
    enums:
    - name: "app.CharacterEditDefine.TopsBdMeshID"
      format: "tops_{id}_bd"
      primary: true
    zero_entity:
      id: 0
      label: None
    fields:
    - name: mesh
      resource:
        custom_id_range: [10000, 10000000]
        # catalog entry ID field should be auto determinable here
        file: AppSystem/CharaEdit/ch000/Catalog/TopsBdMeshCatalog_Default.user
        # `type` tells it how to handle the catalog entry
        # resource_proxy_pfb: the entity is an object that contains a via.Prefab and it also has an ID field somewhere
        # optionally we can manually configure but it should reasonably know how to auto determine the prefab and ID fields
        # this one specifically is just a pfb containing a resource path (awful shit, really)
        # the resource part inside the actual pfb will be auto handled to: 1. find single non-transform component, 2. find a resource field
        # additionally, check for any "Enabled" flags and set them true, or maybe we can explicitly configure classname default values instead of looking for an enable flag
        type: resource_proxy_pfb
        # `value_type` could work kinda like a mime type for determining REECE field display and storage format; in this case a resource of type "KnownFileFormats.Texture"
        # in other words, the entity will only store a string path in the JSON and map it out to a pfb file ({resource_without_extension}.pfb) on patching
        # although we already know by resource_proxy_pfb that it's a resource string, we didn't know specifically what kind of string
        resource_type: mesh
    - name: chain
      resource:
        file: AppSystem/CharaEdit/ch000/Catalog/TopsBdChainCatalog_Default.user
        type: resource_proxy_pfb
        resource_type: chain
    - name: cloth
      label: GPU Cloth
      resource:
        file: AppSystem/CharaEdit/ch000/Catalog/TopsBdGpuClothCatalog_Default.user
        type: resource_proxy_pfb
        resource_type: gpuCloth
    - name: clsp
      label: Collision Shape Preset
      resource:
        file: AppSystem/CharaEdit/ch000/Catalog/TopsBdCollisionShapePresetCatalog_Default.user
        type: resource_proxy_pfb
        resource_type: collisionShapePreset
    - name: sfur
      label: Shell Fur
      resource:
        file: AppSystem/CharaEdit/ch000/Catalog/TopsBdShellFurCatalog_Default.user
        type: resource_proxy_pfb
        resource_type: shellFur

  items.styles.tops.TopsBdSkin:
    to_string: "{id:enum(app.CharacterEditDefine.TopsBdSkinID)} | {skin.path}"
    display_name: Body Skin
    enums:
    - name: app.CharacterEditDefine.TopsBdSkinID
      format: "tops_bd_{id}"
      primary: true
    zero_entity:
      id: 0
      label: None
    fields:
    - name: skin
      resource:
        file: AppSystem/CharaEdit/ch000/Catalog/TopsBdSkinCatalog_Default.user
        to_string: "{id:enum(app.CharacterEditDefine.TopsBdSkinID)} | {path}"
        custom_id_range: [10000, 10000000]
        type: resource_proxy_pfb
        resource_type: meshMaterial

# enum mapping creation flow
# existing style
# 1. fetch data
# 2. we have a _TopsStyle value
# 3. try parse enum
# 4. success in parsing enum, use that parsed value as ID
# return { value: data._TopsStyle, label: "tops_003", id: 3 }

# new style
# 1. create data
# 2. we have a _TopsStyle value (random number)
# 3. try parse enum
# 4. parse failed
# 5. therefore generate arbitrary new random ID
# return { value: data._TopsStyle, label: "tops_54123", id: 54123 }

