entities:
  items.styles.TopsStyle:
    primary_field: data
    id_field: styleNo
    to_string: "Tops Style {id}: {data.0._TopsStyle:enum(app.TopsStyle)}"
    fields:
    - name: data
      type: items.styles.TopsStyle
      field_id: { field: styleNo, path: value }
      # enums:
      # - name: app.TopsStyle
      #   new_label_format: "Tops_{data._TopsStyle:D03}"
      #   primary: true
    - name: styleNo
      resource:
        type: enum_mapping
        classname: app.TopsStyle
        custom_id_range: [10000, 32700] # _StyleNo on the armor data is a signed short so we need to limit to that range
        params:
          virtual_enum_name: ce.TopsStyleNo
          new_label_format: "Tops_{id:D03}"
          label_id_parse: "Tops_(\\d+)"
          value_from: { field: data, path: _TopsStyle }
    jsonExample: {
      id: 3,
      fields: {
        StyleNo: {
          id: 3,
          label: Tops_003,
          value: 5123123627
        }
      }
    }


# enum mapping creation flow
# existing style
# 1. fetch data
# 2. we have a _TopsStyle value
# 3. try parse enum
# 4. success in parsing enum, use that parsed value as ID
# return { value: data._TopsStyle, label: "tops_003", id: 3 }

# new style
# 1. create data
# 2. we have a _TopsStyle value (random number)
# 3. try parse enum
# 4. parse failed
# 5. therefore generate arbitrary new random ID
# return { value: data._TopsStyle, label: "tops_54123", id: 54123 }

resources:
  items.styles.TopsStyle:
    file: AppSystem/CharaEdit/ch000/SwapData/TopsSwapData.user
    type: array-file
    id: [_TopsStyle]
    sub_id: [_Gender]
    custom_id_range: [10000, 10000000]
    classname: app.TopsSwapItem
    # prevent direct editing - all editing of this data should be done from entities
    not_standalone: true
    # note: we don't want to control the app.TopsStyle enum from here because we have two objects per enum value and that would complicate things
    # the enum should be controlled by the entity instead
    resources:
    - { key: bd_mesh, type: TopsBdMesh, name: Body Mesh, field: _BdMeshID }
    - { key: bd_skin, type: TopsBdSkin, name: Body Skin, field: _BdSkinID }
    - { key: bd_cloth, type: TopsBdCloth, name: Body Cloth, field: _BdMeshID }
    - { key: bd_chain, type: TopsBdChain, name: Body Chain, field: _BdMeshID }
    - { key: bd_clsp, type: TopsBdClsp, name: Body Collision Shape Preset, field: _BdMeshID }
    - { key: bd_sfur, type: TopsBdSfur, name: Body Shell Fur, field: _BdMeshID }
    - { key: bd_mesh_sub, type: TopsBdMesh, name: Body Sub Mesh, field: _BdSubMeshID }
    - { key: bd_skin_sub, type: TopsBdSkin, name: Body Sub Skin, field: _BdSubSkinID }
    - { key: bd_cloth_sub, type: TopsBdCloth, name: Body Sub Cloth, field: _BdSubMeshID }
    - { key: bd_chain_sub, type: TopsBdChain, name: Body Sub Chain, field: _BdSubMeshID }
    - { key: bd_clsp_sub, type: TopsBdClsp, name: Body Sub Collision Shape Preset, field: _BdMeshID }
    - { key: bd_sfur_sub, type: TopsBdSfur, name: Body Sub Shell Fur, field: _BdMeshID }
    - { key: wb_mesh, type: TopsWbMesh, name: Waistband Mesh, field: _WbMeshID }
    - { key: wb_skin, type: TopsWbSkin, name: Waistband Skin, field: _WbSkinID }
    - { key: wb_mesh_sub, type: TopsWbMesh, name: Waistband Sub Mesh, field: _WbSubMeshID }
    - { key: wb_skin_sub, type: TopsWbSkin, name: Waistband Sub Skin, field: _WbSubSkinID }
    - { key: am_mesh, type: TopsAmMesh, name: Arm Mesh, field: _AmMeshID }
    - { key: am_skin, type: TopsAmSkin, name: Arm Skin, field: _AmSkinID }
    - { key: am_mesh_sub, type: TopsAmMesh, name: Arm Sub Mesh, field: _AmSubMeshID }
    - { key: am_skin_sub, type: TopsAmSkin, name: Arm Sub Skin, field: _AmSubSkinID }
    - { key: bt_mesh, type: TopsBtMesh, name: Belt Mesh, field: _BtMeshID }
    - { key: bt_skin, type: TopsBtSkin, name: Belt Skin, field: _BtSkinID }
    - { key: bt_mesh_sub, type: TopsBtMesh, name: Belt Sub Mesh, field: _BtSubMeshID }
    - { key: bt_skin_sub, type: TopsBtSkin, name: Belt Sub Skin, field: _BtSubSkinID }
    - { key: furmask_male, type: FurMask_Tops_M, name: Fur Mask Male, field: _TopsStyle }
    - { key: furmask_female, type: FurMask_Tops_F, name: Fur Mask Female, field: _TopsStyle }

  items.catalogs.TopsBdMesh:
    # catalog entry ID field should be auto determinable here
    file: AppSystem/CharaEdit/ch000/Catalog/TopsBdMeshCatalog_Default.user
    # `type` tells it how to handle the catalog entry
    # resource_proxy_pfb: the entity is an object that contains a via.Prefab and it also has an ID field somewhere
    # optionally we can manually configure but it should reasonably know how to auto determine the prefab and ID fields
    # this one specifically is just a pfb containing a resource path (awful shit, really)
    # the resource part inside the actual pfb will be auto handled to: 1. find single non-transform component, 2. find a resource field
    # additionally, check for any "Enabled" flags and set them true, or maybe we can explicitly configure classname default values instead of looking for an enable flag
    type: resource_proxy_pfb
    # `value_type` could work kinda like a mime type for determining REECE field display and storage format; in this case a resource of type "KnownFileFormats.Texture"
    # in other words, the entity will only store a string path in the JSON and map it out to a pfb file ({resource_without_extension}.pfb) on patching
    # although we already know by resource_proxy_pfb that it's a resource string, we didn't know specifically what kind of string
    # value_type would probably be a parameter of the catalog_entry_type so maybe just do resource_type: Mesh here
    # value_type: resource/Mesh
    resource_type: mesh
    # enums:
    # - name: "app.CharacterEditDefine.TopsBdMeshID"
    #   format: "tops_bd_{id}"
    #   primary: true
  items.catalogs.TopsBdSkin:
    file: AppSystem/CharaEdit/ch000/Catalog/TopsBdSkinCatalog_Default.user
    enums:
    - name: app.CharacterEditDefine.TopsBdSkinID
      format: "tops_bd_{id}"
      primary: true
    type: resource_proxy_pfb
    resource_type: texture
  items.catalogs.TopsBdChain:
    file: AppSystem/CharaEdit/ch000/Catalog/TopsBdChainCatalog_Default.user
    # `parent_resource` denotes that this resource relies on another resource existing and inherits its ID from the parent
    parent_resource: TopsBdMesh
    enums:
    - name: app.CharacterEditDefine.TopsBdMeshID
      format: "tops_bd_{id}"
    type: resource_proxy_pfb
    resource_type: chain
  items.catalogs.TopsBdCloth:
    file: AppSystem/CharaEdit/ch000/Catalog/TopsBdClothCatalog_Default.user
    parent_resource: TopsBdMesh
    enums:
    - name: app.CharacterEditDefine.TopsBdMeshID
    type: resource_proxy_pfb
    resource_type: gpuCloth
  items.catalogs.TopsBdClsp:
    file: AppSystem/CharaEdit/ch000/Catalog/TopsBdClspCatalog_Default.user
    parent_resource: TopsBdMesh
    enums:
    - name: app.CharacterEditDefine.TopsBdMeshID
    type: resource_proxy_pfb
    resource_type: collisionShapePreset
  items.catalogs.TopsBdSfur:
    file: AppSystem/CharaEdit/ch000/Catalog/TopsBdShellFurCatalog_Default.user
    parent_resource: TopsBdMesh
    enums:
    - name: app.CharacterEditDefine.TopsBdMeshID
    type: resource_proxy_pfb
    resource_type: shellFur

  items.catalogs.TopsWbMesh:
    file: AppSystem/CharaEdit/ch000/Catalog/TopsWbMeshCatalog_Default.user
    enums:
    - name: app.CharacterEditDefine.TopsWbMeshID
      format: "tops_wb_{id}"
      primary: true
    type: resource_proxy_pfb
    resource_type: mesh
  items.catalogs.TopsWbSkin:
    file: AppSystem/CharaEdit/ch000/Catalog/TopsWbSkinCatalog_Default.user
    enums:
    - name: app.CharacterEditDefine.TopsWbSkinID
      format: "tops_wb_{id}"
      primary: true
    type: resource_proxy_pfb
    resource_type: texture
  items.catalogs.TopsAmMesh:
    file: AppSystem/CharaEdit/ch000/Catalog/TopsAmMeshCatalog_Default.user
    enums:
    - name: app.CharacterEditDefine.TopsAmMeshID
      format: "tops_am_{id}"
      primary: true
    type: resource_proxy_pfb
    resource_type: mesh
  items.catalogs.TopsAmSkin:
    file: AppSystem/CharaEdit/ch000/Catalog/TopsAmSkinCatalog_Default.user
    enums:
    - name: app.CharacterEditDefine.TopsAmSkinID
      format: "tops_am_{id}"
      primary: true
    type: resource_proxy_pfb
    resource_type: texture
  items.catalogs.TopsBtMesh:
    file: AppSystem/CharaEdit/ch000/Catalog/TopsBtMeshCatalog_Default.user
    enums:
    - name: app.CharacterEditDefine.TopsBtMeshID
      format: "tops_bt_{id}"
      primary: true
    type: resource_proxy_pfb
    resource_type: mesh
  items.catalogs.TopsBtSkin:
    file: AppSystem/CharaEdit/ch000/Catalog/TopsBtSkinCatalog_Default.user
    enums:
    - name: app.CharacterEditDefine.TopsBtSkinID
      format: "tops_bt_{id}"
      primary: true
    type: resource_proxy_pfb
    resource_type: texture
  items.catalogs.UnderwearMesh:
    file: AppSystem/CharaEdit/ch000/Catalog/UnderwearMeshCatalog_Default.user
    enums:
    - name: app.CharacterEditDefine.UnderwearMeshID
      format: "underwear_{id}"
      primary: true
    type: resource_proxy_pfb
    resource_type: mesh
  items.catalogs.UnderwearSkin:
    file: AppSystem/CharaEdit/ch000/Catalog/UnderwearSkinCatalog_Default.user
    enums:
    - name: app.CharacterEditDefine.UnderwearSkinID
      format: "underwear_{id}"
      primary: true
    type: resource_proxy_pfb
    resource_type: texture

  items.furmask.FurMask_Tops_F:
    file: AppSystem/CharaEdit/ch000/Catalog/FurMaskMapCatalog_f_Tops.user
    # TODO try and find a way where we don't need to specify the classnames on every single resource either
    # classname: app.PartSwapCatalog.Item
    type: resource_proxy_pfb
    resource_type: texture
  items.furmask.FurMask_Tops_M:
    file: AppSystem/CharaEdit/ch000/Catalog/FurMaskMapCatalog_m_Tops.user
    # classname: app.PartSwapCatalog.Item
    type: resource_proxy_pfb
    resource_type: texture

classes:
  app.TopsSwapItem:
    to_string: "{class_shortname} {_TopsStyle:enum(app.TopsStyle)} {_Gender:enum(app.Gender)}"
