entities:
  items.styles.underwear.UnderwearStyle:
    primary_field: data
    id_field: styleNo
    to_string: "Underwear Style {id}: {data._Style:enum(app.UnderwearStyle)}"
    display_name: Style
    zero_entity:
      id: 0
    enums:
      - name: app.UnderwearStyle
        format: "Underwear_{id}"
        primary: true
    fields:
    - name: data
      resource:
        type: group
        id: [_Style]
        custom_id_range: [10000, 10000000]
        classname: app.UnderwearSwapItem
        subtypes:
          male:
            file: AppSystem/CharaEdit/ch000/SwapData/UnderwearSwapData.user
            type: array-file
            filter:
            - property: _Gender
              equals: 2776536455
          female:
            file: AppSystem/CharaEdit/ch000/SwapData/UnderwearSwapData.user
            type: array-file
            filter:
            - property: _Gender
              equals: 1910070090

  items.styles.underwear.UnderwearMesh:
    to_string: "UnderwearMesh {id:enum(app.CharacterEditDefine.UnderwearMeshID)} | {mesh._Mesh}"
    display_name: Underwear Mesh
    allow_templates: false
    enums:
    - name: "app.CharacterEditDefine.UnderwearMeshID"
      format: "underwear_{id}"
      primary: true
    zero_entity:
      id: 0
      label: None
    fields:
    - name: mesh
      required: true
      resource:
        custom_id_range: [10000, 10000000]
        file: AppSystem/CharaEdit/ch000/Catalog/UnderwearMeshCatalog.user
        type: resource_proxy_pfb
        params:
          skipFields: 1
    runtime_mapping:
      runtime_type: Underwear
      to_both:
        mesh: Mesh

  items.styles.underwear.UnderwearSkin:
    to_string: "UnderwearSkin {id:enum(app.CharacterEditDefine.UnderwearSkinID)} | {skin._Material}"
    display_name: Underwear Skin
    allow_templates: false
    enums:
    - name: app.CharacterEditDefine.UnderwearSkinID
      format: "underwear_{id}"
      primary: true
    zero_entity:
      id: 0
      label: None
    fields:
    - name: skin
      required: true
      resource:
        file: AppSystem/CharaEdit/ch000/Catalog/UnderwearSkinCatalog.user
        custom_id_range: [10000, 10000000]
        type: resource_proxy_pfb
        params:
          skipFields: 1
    runtime_mapping:
      runtime_type: UnderwearSkin
      to_both:
        skin: Skin

classes:
  app.UnderwearSwapItem:
    to_string: "{class_shortname} {_Style:enum(app.UnderwearStyle)} {_Gender:enum(app.Gender)}"
    fields:
      _Style: { readOnly: true }
      _Gender: { readOnly: true }
      _MeshID: { enum: UnderwearMesh, label: Mesh }
      _SkinID: { enum: UnderwearSkin, label: Skin }
