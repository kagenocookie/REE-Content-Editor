# list of resources required for a new common NPC:
# - textures - body (ALBD, NRRA), head (ALBD, NRRA)
# - spawn an NPC somewhere - natives/stm/appdata/generate/manualset/content/**/npc/normal/normal.user.2

# other, maybe useless?
# natives/stm/appdata/generate/manualset/simpleglobalnpcsettable.user.2
# natives/stm/appdata/generate/manualset/simpleglobalappendnpcsettable.user.2

entities:
  characters.NpcData:
    enums:
    - name: app.CharacterID
      format: "{name}"
      primary: true
    to_string: "NPC {name}: {displayName}"
    # TODO disallow new npc creation until we support initial string input
    allow_create_empty: false
    fields:
      - name: data
        label: Data
        required: true
        resource:
          id: [ID]
          type: object-catalog
          custom_id_range: [1000, 999999]
          filter:
          - property: _SubNPC
            equals: false
          file: AppSystem/ch/ch300/UserData/CharacterDataList.user
          classname: app.CharacterData
      - name: alternativeData
        label: Sub NPC Data
        required: true
        resource:
          id: [ID]
          type: object-catalog
          custom_id_range: [1000, 999999]
          filter:
          - property: _SubNPC
            equals: true
          file: AppSystem/ch/ch300/UserData/CharacterDataList.user
          classname: app.CharacterData
      - name: edit_data
        label: Customization
        required: true
        resource:
          id: [_CharacterID]
          type: object-catalog
          classname: app.charaedit.ch000.EditDataTable.Data
          file: AppSystem/CharaEdit/ch000/EditDataTable_Npc.user
      - name: name
        label: NPC internal code name
        required: true
        display_after: start
        resource:
          type: string
          params:
            diffable: false
            regex: "^ch3[0-9_]{5}$"
            regexDescription: "Example: ch302345"
            tooltip: Enter a code name for the NPC. This should be unique across all characters, used for translation keys and file names.
            initial: "{id:enum_name(app.CharacterID)}"
      - name: displayName
        label: Name
        required: true
        display_after: name
        resource:
          type: msg
          file: Message/UI/CharacterName.msg
          params:
            key_format: "Mes_{name}"
      - name: displayName_sub
        label: Sub Name
        display_after: displayName
        resource:
          type: msg
          file: Message/UI/CharacterName.msg
          params:
            key_format: "Mes_{name}_X1"
      - name: scheduleData
        resource:
          type: item-list-catalog
          classname: app.NPCSchedule
          id: [ID]
          file: AppSystem/ch/ch300/UserData/NPCScheduleData.user

      - name: headPreBakeTexture_0
        required: true
        field_id:
          format: "{name}_0"
        resource:
          type: resource-holder-pfb
          file: AppSystem/CharaEdit/ch000/Catalog/HeadPreBakeTextureCatalog_Npc.user
          params:
            skipFields: 1
            nested: true
      - name: headPreBakeTexture_1
        field_id:
          format: "{name}_1"
        resource:
          type: resource-holder-pfb
          file: AppSystem/CharaEdit/ch000/Catalog/HeadPreBakeTextureCatalog_Npc.user
          params:
            skipFields: 1
            nested: true
      - name: headPreBakeTexture_2
        field_id:
          format: "{name}_2"
        resource:
          type: resource-holder-pfb
          file: AppSystem/CharaEdit/ch000/Catalog/HeadPreBakeTextureCatalog_Npc.user
          params:
            skipFields: 1
            nested: true
      - name: bodyPreBakeTexture_0
        required: true
        field_id:
          format: "{name}_0"
        resource:
          type: resource-holder-pfb
          file: AppSystem/CharaEdit/ch000/Catalog/BodyPreBakeTextureCatalog_Npc.user
          params:
            skipFields: 1
            nested: true
      - name: bodyPreBakeTexture_1
        field_id:
          format: "{name}_1"
        resource:
          type: resource-holder-pfb
          file: AppSystem/CharaEdit/ch000/Catalog/BodyPreBakeTextureCatalog_Npc.user
          params:
            skipFields: 1
            nested: true
      - name: bodyPreBakeTexture_2
        field_id:
          format: "{name}_2"
        resource:
          type: resource-holder-pfb
          file: AppSystem/CharaEdit/ch000/Catalog/BodyPreBakeTextureCatalog_Npc.user
          params:
            skipFields: 1
            nested: true
      - name: customLipsyncData
        resource:
          type: resource-holder-pfb
          field: _CharacterElements
          file: AppSystem/Catalog/MainContents/UserData/LipSyncCatalogUserData.user
          params:
            skipFields: 1
            nested: true

