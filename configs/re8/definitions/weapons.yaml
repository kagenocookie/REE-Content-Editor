# character/it/prefab_resourceitem/ri3115/ri3115_inventory.pfb

entities:
  weapon:
    enums:
    - name: offline.EquipmentDefine.WeaponType
      format: "{name}"
      primary: true
    to_string: "Weapon {id}: {data.Basic.NameMessageID:translate()}"
    fields:
      - name: data
        label: Data
        required: true
        resource:
          id: [ItemID]
          type: array-file
          file: natives/stm/singletonuserdatas/playerweaponspecificationdata.user.2
          params:
            nested: false
      - name: prefab
        label: Weapon prefab
        required: true
        field_type: resource_link
        resource:
          resource_type: prefab
          params:
            path: "{catalog?.Prefab?.Path}"

classes:
  app.ItemSpecificationData.SpecUnit:
    to_string: "Item {ItemID}: {Basic.NameMessageID:translate()}"
