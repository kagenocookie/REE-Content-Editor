entities:
  costumes.timeline_costume:
    to_string: "Timeline Costume [{data[0]?._CostumeId}]"
    fields:
    - name: data
      required: true
      resource:
        custom_id_range: [100000, 999999]
        id: [_CostumeId]
        sub_id: [_CostumeVariationId]
        classname: app.TimelineEventCostumeCatalog.Unit
        type: array-file
        file: natives/stm/event/resource/costumecatalog/ch0200.user.3
