classes:
  app.Costume.Closet:
    to_string: "Closet {_CharacterID.Hash:enum(ce.CharacterDefine)} (#{_CharacterID.Hash})"
  app.Costume.Outfit:
    to_string: "Outfit {_CostumeIDHash._TypeSelectHash:enum(ce.CostumeID)} [{_CostumeIDHash._TypeSelectHash}]"
  app.Costume.Part:
    to_string: "{_Name} | Path={_Prefab.Path}"
  app.CostumeIDSelector:
    to_string: "Costume ID {_TypeSelectHash:enum(ce.CostumeID)} [{_TypeSelectHash}]"
  app.gui.CostumeMenuTriggerRelationData.Unit:
    to_string: "Costume Menu Relation Unit [Costume={_CostumeID:enum(ce.CostumeID)}]"
  app.CostumeSwitchingUserData.CostumeSwitchingUnit:
    to_string: "Costume Switching Unit {_SrcCostumeIDHash._TypeSelectHash:enum(ce.CostumeID)} => {_DestCostumeIDHash._TypeSelectHash:enum(ce.CostumeID)}"
